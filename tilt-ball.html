<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e4e7ee">
<title>Tilt Ball</title>
<style>
/* Layout: one full-bleed canvas court; two small chips top-left; gravity dial bottom-right (hidden once tilt works) */
:root {
  --bg: #e4e7ee;
  --dot: #cdd2dc;
  --ink: #262a35;
  --muted: #687084;
  --chip: rgba(255,255,255,.72);
  --accent: #ff5240;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #14171e; --dot: #262b36; --ink: #e8eaf0; --muted: #8e95a6; --chip: rgba(34,38,47,.72); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #14171e; --dot: #262b36; --ink: #e8eaf0; --muted: #8e95a6; --chip: rgba(34,38,47,.72); color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#stage { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.hud { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--chip); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 0; border-radius: 999px; padding: 7px 13px; font: 600 13px/1 var(--font); color: var(--ink); cursor: pointer; }
.chip:focus-visible, #dial:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#dial { position: absolute; right: 16px; bottom: 16px; width: 84px; height: 84px; border-radius: 50%; background: var(--chip); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); touch-action: none; cursor: pointer; }
#dial svg { width: 100%; height: 100%; display: block; }
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Bouncy ball. Drag and fling it; tilt your device to change gravity."></canvas>
  <div class="hud">
    <button class="chip" id="tiltBtn" hidden>Enable tilt</button>
    <button class="chip" id="soundBtn" aria-pressed="true">Sound on</button>
  </div>
  <div id="dial" tabindex="0" role="slider" aria-label="Gravity direction" aria-valuemin="0" aria-valuemax="359" aria-valuenow="90">
    <svg viewBox="-50 -50 100 100" aria-hidden="true">
      <circle r="36" fill="none" stroke="var(--dot)" stroke-width="3"/>
      <g id="arrow">
        <line x1="0" y1="0" x2="0" y2="26" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
        <path d="M-10 20 L0 34 L10 20 Z" fill="var(--accent)"/>
      </g>
      <circle r="6" fill="var(--ink)"/>
    </svg>
  </div>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const tiltBtn = document.getElementById('tiltBtn');
  const soundBtn = document.getElementById('soundBtn');
  const dial = document.getElementById('dial');
  const arrow = document.getElementById('arrow');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- world ----------
  let W = 0, H = 0, dpr = 1, dotColor = '#ccc';
  let R = 44, G = 2600;
  const MU = 0.7;
  const ball = { x: 0, y: 0, vx: 380, vy: -200, w: 0, spin: 0 };
  const q = { x: 0, y: 0, vx: 0, vy: 0 };   // free-flight stretch, double-angle form
  const grav = { x: 0, y: 1 }, target = { x: 0, y: 1 };
  const effects = [];
  let source = 'dial', dialAngle = Math.PI / 2;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    dotColor = getComputedStyle(document.documentElement).getPropertyValue('--dot').trim() || '#ccc';
    const m = Math.min(W, H);
    R = clamp(m * 0.11, 30, 62);
    G = clamp(m * 6.5, 2200, 3600);
    ball.x = clamp(ball.x, R * 0.6, W - R * 0.6);
    ball.y = clamp(ball.y, R * 0.6, H - R * 0.6);
  }

  // ---------- sound + haptics ----------
  let audio = null, soundOn = true;
  try { soundOn = localStorage.getItem('tiltball-sound') !== 'off'; } catch (_) {}
  function syncSoundBtn() { soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; soundBtn.setAttribute('aria-pressed', String(soundOn)); }
  syncSoundBtn();
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn; syncSoundBtn(); unlockAudio();
    try { localStorage.setItem('tiltball-sound', soundOn ? 'on' : 'off'); } catch (_) {}
  });
  function unlockAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    // noise buffer for the slap transient
    const len = Math.floor(audio.sampleRate * 0.05);
    const buf = audio.createBuffer(1, len, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    audio._noise = buf;
  }
  let lastBonk = 0;
  function bonk(strength) {            // strength 0..1
    if (!soundOn || !audio || audio.state !== 'running') return;
    const t = audio.currentTime;
    if (t - lastBonk < 0.03) return;
    lastBonk = t;
    const vol = 0.08 + 0.55 * strength;
    const base = 150 + 70 * Math.random() + 60 * (1 - R / 62);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(base * 2.2, t);
    o.frequency.exponentialRampToValueAtTime(base, t + 0.06);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18 + 0.1 * strength);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 0.35);
    const n = audio.createBufferSource(), f = audio.createBiquadFilter(), ng = audio.createGain();
    n.buffer = audio._noise; f.type = 'bandpass'; f.frequency.value = 900 + 900 * strength; f.Q.value = 0.8;
    ng.gain.value = vol * 0.35;
    n.connect(f).connect(ng).connect(audio.destination);
    n.start(t);
  }
  function buzz(strength) {
    if (navigator.vibrate && strength > 0.15) { try { navigator.vibrate(Math.round(8 + 22 * strength)); } catch (_) {} }
  }

  // ---------- drag: ball rides a spring behind your finger ----------
  let drag = null;
  const KD = 700, CD = 2 * 0.45 * Math.sqrt(700);   // underdamped → wobbly follow
  cv.addEventListener('pointerdown', e => {
    unlockAudio(); maybeAskTilt();
    const p = pt(e);
    if (Math.hypot(p.x - ball.x, p.y - ball.y) > R * 2.2) return;
    cv.setPointerCapture(e.pointerId);
    drag = { id: e.pointerId, ox: ball.x - p.x, oy: ball.y - p.y, tx: ball.x, ty: ball.y, hist: [{ x: p.x, y: p.y, t: e.timeStamp }] };
    cv.classList.add('dragging');
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) {
      const p = pt(ev);
      drag.hist.push({ x: p.x, y: p.y, t: ev.timeStamp });
    }
    while (drag.hist.length > 8) drag.hist.shift();
    const p = pt(e);
    drag.tx = p.x + drag.ox; drag.ty = p.y + drag.oy;
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const h = drag.hist, now = e.timeStamp;
    let i = h.length - 1;
    while (i > 0 && now - h[i - 1].t < 70) i--;
    const a = h[i], b = h[h.length - 1];
    const dt = (b.t - a.t) / 1000;
    if (dt > 0.008 && now - b.t < 90) {
      const fx = (b.x - a.x) / dt, fy = (b.y - a.y) / dt;
      ball.vx = ball.vx * 0.35 + fx * 0.65;
      ball.vy = ball.vy * 0.35 + fy * 0.65;
    }
    const sp = Math.hypot(ball.vx, ball.vy), cap = 7000;
    if (sp > cap) { ball.vx *= cap / sp; ball.vy *= cap / sp; }
    drag = null; cv.classList.remove('dragging');
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  // ---------- gravity dial + keys (when there is no tilt) ----------
  function setDial(ang) {
    dialAngle = ang;
    arrow.setAttribute('transform', `rotate(${ang * 180 / Math.PI - 90})`);
    dial.setAttribute('aria-valuenow', String(Math.round(((ang * 180 / Math.PI) % 360 + 360) % 360)));
    if (source === 'dial') { target.x = Math.cos(ang); target.y = Math.sin(ang); }
  }
  let dialDrag = false;
  function dialFrom(e) {
    const r = dial.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) > 4) setDial(Math.atan2(dy, dx));
  }
  dial.addEventListener('pointerdown', e => { unlockAudio(); dialDrag = true; dial.setPointerCapture(e.pointerId); dialFrom(e); });
  dial.addEventListener('pointermove', e => { if (dialDrag) dialFrom(e); });
  dial.addEventListener('pointerup', () => { dialDrag = false; });
  window.addEventListener('keydown', e => {
    const map = { ArrowDown: Math.PI / 2, ArrowUp: -Math.PI / 2, ArrowLeft: Math.PI, ArrowRight: 0 };
    if (e.key in map && source === 'dial') { setDial(map[e.key]); e.preventDefault(); }
    if (e.key === ' ') { ball.vx -= grav.x * G * 0.45; ball.vy -= grav.y * G * 0.45; e.preventDefault(); }
  });

  // ---------- device motion ----------
  const needsPermission = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
  const isIOS = needsPermission || /iP(hone|ad|od)/.test(navigator.userAgent);
  let gotMotion = false, asked = false;
  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null) return;
    let gx = -a.x / 9.81, gy = a.y / 9.81;
    if (isIOS) { gx = -gx; gy = -gy; }
    const deg = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
    const ang = -deg * Math.PI / 180, c = Math.cos(ang), s = Math.sin(ang);
    target.x = clamp(gx * c - gy * s, -1.5, 1.5);
    target.y = clamp(gx * s + gy * c, -1.5, 1.5);
    if (!gotMotion) { gotMotion = true; source = 'tilt'; dial.hidden = true; tiltBtn.hidden = true; }
  }
  function listen() { window.addEventListener('devicemotion', onMotion); }
  async function maybeAskTilt() {
    if (!needsPermission || asked) return;
    asked = true;
    try {
      const res = await DeviceMotionEvent.requestPermission();
      if (res === 'granted') { listen(); tiltBtn.hidden = true; }
      else { tiltBtn.textContent = 'Tilt blocked'; tiltBtn.disabled = true; tiltBtn.hidden = false; }
    } catch (_) { tiltBtn.hidden = true; }
  }
  if (needsPermission) { tiltBtn.hidden = false; tiltBtn.addEventListener('click', () => { asked = false; maybeAskTilt(); }); }
  else if ('DeviceMotionEvent' in window) listen();

  // ---------- physics ----------
  // Rigid bounces with an animator's cheat: on a real hit the ball sticks to the wall,
  // squashes and holds for a beat, then launches with its rebound velocity, stretched.
  const NORMALS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function wallDist(i, x = ball.x, y = ball.y) { return i === 0 ? x : i === 1 ? W - x : i === 2 ? y : H - y; }
  const REST = 0.82, HOLD_MIN = 170;
  let hold = null;           // { wall, t, T, sq, vx, vy }
  let restWall = -1, restPress = 0;

  function stretchTarget(vx, vy) {
    const sp = Math.hypot(vx, vy);
    const s = Math.min(Math.max(0, sp - 280) / 2300, 0.62) * (reduced ? 0.35 : 1);
    const e = 0.5 * Math.log(1 + s);            // length:width ratio = 1 + s
    const t2 = 2 * Math.atan2(vy, vx);
    return [e * Math.cos(t2), e * Math.sin(t2)];
  }

  function step(dt) {
    const gl = Math.min(1, dt * 10);
    grav.x += (target.x - grav.x) * gl; grav.y += (target.y - grav.y) * gl;
    ball.spin += ball.w * dt;

    if (hold) {
      hold.t += dt;
      const [nx, ny] = NORMALS[hold.wall], tx = -ny, ty = nx;
      // the contact patch keeps sliding along the wall while the ball is squashed
      ball.x += tx * hold.vt * dt; ball.y += ty * hold.vt * dt;
      hold.vt *= 1 - 0.6 * dt;
      let other = false;
      for (let i = 0; i < 4; i++) if (i !== hold.wall && wallDist(i) < R) other = true;
      // free-flight stretch eases toward the slide direction while held (no snap)
      const [ex, ey] = stretchTarget(tx * hold.vt, ty * hold.vt);
      q.vx += ((ex * 0.6 - q.x) * 420 - q.vx * 13) * dt;
      q.vy += ((ey * 0.6 - q.y) * 420 - q.vy * 13) * dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (drag) { hold = null; }
      else if (hold.t >= hold.T || other) {
        ball.vx = nx * hold.vn + tx * hold.vt; ball.vy = ny * hold.vn + ty * hold.vt;
        const [sx, sy] = stretchTarget(ball.vx, ball.vy);
        q.vx += (sx * 1.25 - q.x) * 30; q.vy += (sy * 1.25 - q.y) * 30;   // spring out stretched
        hold = null;
        if (!other) return;
      } else return;
    }

    let ax = 0, ay = 0;
    if (drag) {
      ax += KD * (drag.tx - ball.x) - CD * ball.vx;
      ay += KD * (drag.ty - ball.y) - CD * ball.vy;
    } else {
      ax += grav.x * G; ay += grav.y * G;
      ax -= ball.vx * 0.05; ay -= ball.vy * 0.05;
    }
    ball.vx += ax * dt; ball.vy += ay * dt;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;

    restWall = -1; restPress = 0;
    let touching = false;
    for (let i = 0; i < 4; i++) {
      const [nx, ny] = NORMALS[i];
      const d = wallDist(i);
      if (d > R + 0.5) continue;
      touching = true;
      if (d < R) { ball.x += nx * (R - d); ball.y += ny * (R - d); }
      const tx = -ny, ty = nx;
      const vn = ball.vx * nx + ball.vy * ny;
      let vt = ball.vx * tx + ball.vy * ty;
      if (vn < 0) {
        const hit = -vn;
        // friction at contact turns sliding into spin (disc inertia → slip/3)
        const slip = vt - ball.w * R;
        const j = clamp(slip / 3, -0.6 * hit * 1.8, 0.6 * hit * 1.8);
        vt -= j; ball.w += 2 * j / R;
        const out = hit * REST;
        if (hit > 120) { const s = clamp(hit / 3000, 0, 1); bonk(s); buzz(s); }
        if (hit > HOLD_MIN && !drag) {
          const s = clamp(hit / 3000, 0, 1);
          hold = {
            wall: i, t: 0,
            T: (0.05 + 0.08 * Math.sqrt(s)) * (reduced ? 0.5 : 1),
            sq: clamp(0.08 + 0.42 * Math.sqrt(s), 0.08, 0.45) * (reduced ? 0.5 : 1),
            vn: out, vt
          };
          if (hit > 700 && !reduced) effects.push({ wall: i, at: i < 2 ? ball.y : ball.x, s, t: 0 });
          ball.vx = 0; ball.vy = 0;
          return;
        }
        const nv = out > 60 ? out : 0;
        ball.vx = nx * nv + tx * vt; ball.vy = ny * nv + ty * vt;
      }
      // resting / rolling contact
      const press = -(grav.x * nx + grav.y * ny);
      if (press > 0.05 && !drag && Math.abs(ball.vx * nx + ball.vy * ny) < 1) {
        vt *= 1 - Math.min(1, 0.35 * press * dt);
        const vn2 = ball.vx * nx + ball.vy * ny;
        ball.vx = nx * vn2 + tx * vt; ball.vy = ny * vn2 + ty * vt;
        ball.w = vt / R;
        if (press > restPress) { restPress = press; restWall = i; }
      }
    }
    if (!touching) ball.w *= 1 - 0.15 * dt;

    // free-flight stretch along velocity, on a springy lag so it wobbles
    const [ex, ey] = stretchTarget(ball.vx, ball.vy);
    const KQ = 420, CQ = 13;
    q.vx += ((ex - q.x) * KQ - q.vx * CQ) * dt;
    q.vy += ((ey - q.y) * KQ - q.vy * CQ) * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
  }

  // ---------- shape ----------
  // Either a squash against one wall (hold, drag-into-wall, or resting weight) or a free stretch.
  const N = 96;
  const CIRC = Array.from({ length: N }, (_, i) => [Math.cos(i / N * Math.PI * 2), Math.sin(i / N * Math.PI * 2)]);
  const shape = { E: 0, c: 1, s: 0, sc: 1, cx: 0, cy: 0 };
  function mapPt(u, v, out) {
    const { c, s, E } = shape;
    const lu = c * u + s * v, lv = -s * u + c * v;
    const su = lu * Math.exp(E), sv = lv * Math.exp(-E);
    let x = shape.cx + R * shape.sc * (c * su - s * sv);
    let y = shape.cy + R * shape.sc * (s * su + c * sv);
    if (x < 0) x = 0; else if (x > W) x = W;
    if (y < 0) y = 0; else if (y > H) y = H;
    out[0] = x; out[1] = y;
    return out;
  }
  const tmp = [0, 0];
  function outlineArea() {
    let a = 0, px = 0, py = 0, fx = 0, fy = 0;
    for (let i = 0; i < N; i++) {
      mapPt(CIRC[i][0], CIRC[i][1], tmp);
      if (i) a += px * tmp[1] - tmp[0] * py; else { fx = tmp[0]; fy = tmp[1]; }
      px = tmp[0]; py = tmp[1];
    }
    a += px * fy - fx * py;
    return Math.abs(a) / 2;
  }
  function squashProfile(u) {
    // slam in over the first fifth, hold, then ease back out
    if (u < 0.2) { const k = u / 0.2; return 1 - (1 - k) * (1 - k); }
    const k = (u - 0.2) / 0.8;
    return 1 - k * k * (3 - 2 * k);
  }
  function solveShape() {
    let wall = -1, sq = 0;
    if (hold) { wall = hold.wall; sq = hold.sq * squashProfile(hold.t / hold.T); }
    else if (drag) {
      for (let i = 0; i < 4; i++) {
        const over = R - wallDist(i, drag.tx, drag.ty);
        const s = clamp(over / (R * 2.2), 0, 0.42);
        if (s > sq && wallDist(i) < R + 1) { sq = s; wall = i; }
      }
    } else if (restWall >= 0) { wall = restWall; sq = 0.05 * Math.min(restPress, 1.2); }

    // stretch and squash live in the same double-angle tensor, so they blend smoothly
    let QX = q.x, QY = q.y;
    const qm = Math.hypot(QX, QY);
    if (qm > 0.3) { QX *= 0.3 / qm; QY *= 0.3 / qm; }
    if (wall >= 0 && sq > 0.005) {
      const [nx, ny] = NORMALS[wall];
      const tt = 2 * Math.atan2(nx, -ny);   // axis along the wall
      const Es = -Math.log(1 - sq);         // ×1/(1-sq) along the wall, ×(1-sq) into it
      QX += Es * Math.cos(tt); QY += Es * Math.sin(tt);
    }
    const E = Math.min(Math.hypot(QX, QY), 0.85), th = Math.atan2(QY, QX) / 2;
    shape.E = E; shape.c = Math.cos(th); shape.s = Math.sin(th);
    shape.cx = ball.x; shape.cy = ball.y;
    if (wall >= 0 && sq > 0.005) {
      const [nx, ny] = NORMALS[wall];
      const phi = Math.atan2(ny, nx) - th;
      const half = R * Math.hypot(Math.exp(E) * Math.cos(phi), Math.exp(-E) * Math.sin(phi));
      const press = 0.94;                   // a little overlap so the contact side flattens
      shape.cx = ball.x - nx * (R - half * press);
      shape.cy = ball.y - ny * (R - half * press);
    }
    const want = 0.5 * N * Math.sin(2 * Math.PI / N) * R * R;
    shape.sc = 1;
    for (let k = 0; k < 3; k++) shape.sc *= Math.sqrt(want / outlineArea());
    shape.sc = clamp(shape.sc, 1, 1.35);
  }
  function tracePoly(pts) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      mapPt(pts[i][0], pts[i][1], tmp);
      i ? ctx.lineTo(tmp[0], tmp[1]) : ctx.moveTo(tmp[0], tmp[1]);
    }
    ctx.closePath();
  }
  // a band across the ball (|v'| < h in a frame rotated by ang), sampled in unit-disk space
  function bandPts(h, ang) {
    const a = Math.sqrt(1 - h * h), as = Math.asin(h), pts = [];
    const S = 20;
    for (let i = 0; i <= S; i++) pts.push([-a + 2 * a * i / S, h]);
    for (let i = 1; i < S; i++) { const p = as - 2 * as * i / S; pts.push([Math.cos(p), Math.sin(p)]); }
    for (let i = 0; i <= S; i++) pts.push([a - 2 * a * i / S, -h]);
    for (let i = 1; i < S; i++) { const p = Math.PI + as - 2 * as * i / S; pts.push([Math.cos(p), Math.sin(p)]); }
    const c = Math.cos(ang), s = Math.sin(ang);
    return pts.map(([u, v]) => [c * u - s * v, s * u + c * v]);
  }
  const BAND = bandPts(0.26, 0), STRIPE = bandPts(0.12, Math.PI / 2);
  function rotPts(pts, a) { const c = Math.cos(a), s = Math.sin(a); return pts.map(([u, v]) => [c * u - s * v, s * u + c * v]); }

  // ---------- render ----------
  function draw(dtFrame) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = dotColor;
    const gap = 26, ox = (W % gap) / 2, oy = (H % gap) / 2;
    for (let y = oy + gap / 2; y < H; y += gap) for (let x = ox + gap / 2; x < W; x += gap) ctx.fillRect(x - 1, y - 1, 2, 2);

    solveShape();

    // body + soft shadow thrown along gravity
    const gm = Math.min(1, Math.hypot(grav.x, grav.y));
    tracePoly(CIRC);
    ctx.save();
    ctx.shadowColor = `rgba(10,14,30,${0.18 + 0.12 * gm})`;
    ctx.shadowBlur = R * 0.5 * dpr;
    ctx.shadowOffsetX = grav.x * R * 0.18 * dpr;
    ctx.shadowOffsetY = grav.y * R * 0.18 * dpr;
    ctx.fillStyle = '#ff5240';
    ctx.fill();
    ctx.restore();

    ctx.save();
    tracePoly(CIRC); ctx.clip();
    ctx.fillStyle = '#ffc93a'; tracePoly(rotPts(BAND, ball.spin)); ctx.fill();
    ctx.fillStyle = '#2f5fe0'; tracePoly(rotPts(STRIPE, ball.spin)); ctx.fill();
    // fixed key light from top-left, rim darkening
    const lx = shape.cx - R * 0.38 * shape.sc, ly = shape.cy - R * 0.45 * shape.sc;
    const lg = ctx.createRadialGradient(lx, ly, R * 0.05, shape.cx, shape.cy, R * 1.25 * shape.sc);
    lg.addColorStop(0, 'rgba(255,255,255,0.5)');
    lg.addColorStop(0.3, 'rgba(255,255,255,0.08)');
    lg.addColorStop(0.75, 'rgba(0,0,0,0.06)');
    lg.addColorStop(1, 'rgba(30,0,10,0.38)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    // glossy highlight that squashes with the ball
    mapPt(-0.42, -0.5, tmp);
    const hg = ctx.createRadialGradient(tmp[0], tmp[1], 0, tmp[0], tmp[1], R * 0.32);
    hg.addColorStop(0, 'rgba(255,255,255,0.85)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
    ctx.restore();

    tracePoly(CIRC);
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(60,8,8,0.35)'; ctx.stroke();

    // impact ticks on the wall
    for (let i = effects.length - 1; i >= 0; i--) {
      const fx = effects[i];
      fx.t += dtFrame;
      const life = 0.28, k = fx.t / life;
      if (k >= 1) { effects.splice(i, 1); continue; }
      const [nx, ny] = NORMALS[fx.wall];
      const tx = -ny, ty = nx;
      const wx = fx.wall === 0 ? 0 : fx.wall === 1 ? W : fx.at;
      const wy = fx.wall === 2 ? 0 : fx.wall === 3 ? H : fx.at;
      ctx.strokeStyle = `rgba(255,82,64,${(1 - k) * 0.9})`;
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      const spread = R * (0.9 + 0.6 * fx.s), len = R * (0.25 + 0.35 * fx.s) * (1 - k * 0.5), push = R * 0.2 + k * R * 0.5;
      for (const side of [-1, 1]) {
        const bx = wx + tx * side * spread, by = wy + ty * side * spread;
        const dx = nx * 0.55 + tx * side, dy = ny * 0.55 + ty * side, dl = Math.hypot(dx, dy);
        const sx = bx + dx / dl * push, sy = by + dy / dl * push;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + dx / dl * len, sy + dy / dl * len); ctx.stroke();
      }
    }
  }

  // ---------- loop ----------
  let last = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
    const n = Math.max(1, Math.ceil(dt * 480));
    for (let i = 0; i < n; i++) step(dt / n);
    draw(dt);
    requestAnimationFrame(frame);
  }

  resize();
  ball.x = W * 0.3; ball.y = H * 0.25;
  setDial(Math.PI / 2);
  window.addEventListener('resize', resize);
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', resize); } catch (_) {}
  try { new MutationObserver(resize).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (_) {}
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>

</body>
</html>
