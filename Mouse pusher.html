<header>
  <h1>Mouse pusher</h1>
  <div id="audit" aria-live="polite">
    <div id="auditMain">0 overlaps</div>
    <div id="auditSub">lag 0.0 px</div>
  </div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Top-down play area. The cursor character follows your mouse."></canvas>
  <div id="hint">Click the mat to take control. Press Esc to let go.</div>
</div>
<footer>
  <div class="row">
    <div class="seg" role="group" aria-label="Push strength">
      <button id="sWeak" aria-pressed="false">Weak</button>
      <button id="sMedium" aria-pressed="true">Medium</button>
      <button id="sStrong" aria-pressed="false">Strong</button>
    </div>
    <button id="bReset">Reset</button>
  </div>
  <div id="note">Weak can't budge the big crate. Lag shows how far the mouse is behind your pointer.</div>
</footer>

<script>
"use strict";
// ===== PHYSICS =====

const MU_G = 600;                 // ground friction: a sliding box decelerates at 600 px/s^2
const DENSITY = 0.01;

// no contact approaches faster than its gap allows. One box-constrained QP per
// island of touching bodies, with these rows:
//   n  contact normal: impulse >= 0

//   g  ground friction (top-down): |impulse| <= MU_G * m * h  (sticks, then slides)

//      cursor free to slide along it)

function buildRows(h) {

      // doesn't need them for its own speed: it's nearly massless and the mover
      // stops it exactly at whatever it hits. Leaving its speed out avoids "ghost"

    const boxes = bodies.filter(b => b.kind === "box"), awake = boxes.filter(b => !b.asleep).length;
    // locked or touch: how much of the last frame's movement something blocked.
    // following the real pointer: how far the mouse is behind it.
    const what = mode === "follow" ? "lag" : "blocked";
    auditSub.textContent = `${what} ${lastGap.toFixed(1)} px, ${awake} of ${boxes.length} awake, ${Math.round(fps)} fps`;
  }
  requestAnimationFrame(loop);
}
readColors(); reset(); resize();
if (matchMedia("(pointer: coarse)").matches) setHint("Drag anywhere to move the mouse.");
else if (!lockable) startFollow("Move your pointer over the mat. You are the mouse.");
requestAnimationFrame(loop);
</script>
